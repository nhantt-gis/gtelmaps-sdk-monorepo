# =============================================================================
# demo-3d-react — cấu hình phục vụ bản build tĩnh.
#
# HAI GỐC THƯ MỤC, KHÔNG PHẢI MỘT:
#
#   /usr/share/nginx/html   bản build Vite (index.html + assets/), nằm TRONG image
#   /srv/public             31 MB dữ liệu tĩnh, MOUNT :ro từ host lúc chạy
#
# Không thể mount public/ đè lên html/ vì sẽ che mất index.html và assets/. Thay
# vào đó, sáu tiền tố gốc mà app xin dữ liệu — /tiles/ /models/ /textures/
# /sprites/ /styles/ /api/ — được trỏ sang gốc thứ hai bằng `root /srv/public`.
# Tên trong URL trùng tên thư mục dưới public/ nên ánh xạ là một-một.
#
# ĐIỀU QUAN TRỌNG NHẤT TRONG FILE NÀY — chép từ vite.config.ts:33:
#
#   "bất kỳ server nào phục vụ dist/ đều phải trả 404 cho tile không có.
#    Một static server bình thường làm đúng; chỉ SPA fallback mới sai."
#
# tippecanoe không ghi tile ở chỗ không có gì để vẽ. Nếu SPA fallback trả
# index.html kèm 200, bộ giải mã gặp HTML ở chỗ nó chờ protobuf và báo
# "Unimplemented type" — một câu không nói gì về nguyên nhân thật. Tệ hơn: tile
# ấy bị tính là HỎNG chứ không phải RỖNG, nên MapLibre giữ lại một tile thô hơn
# để lấp chỗ trống, và giữ VĨNH VIỄN — cùng một dãy nhà đến từ nhiều mức zoom
# một lúc.
#
# Ba khối `location ~` dưới đây là biểu thức chính quy, mà nginx so khớp regex
# TRƯỚC tiền tố `location /`. Chính quan hệ đó khiến SPA fallback ở cuối file
# không bao giờ nuốt được một tile thiếu. Đừng đổi chúng thành `location ^~`
# hay gộp vào fallback.
# =============================================================================

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # nginx nghe cổng 80 trong container nhưng ánh xạ ra cổng khác trên host
    # (mặc định 8180). Để absolute thì nginx tự dựng URL theo cổng 80 và mất
    # `:8180` ở mọi lần chuyển hướng thêm dấu '/'.
    absolute_redirect off;

    # ---- Nén ----
    # Tile trên đĩa KHÔNG nén sẵn (magic `1a…`, không phải `1f8b`) nên nginx tự
    # nén và tự đặt Content-Encoding: gzip. Cặp ấy phải đi cùng nhau: byte gzip
    # mà thiếu header thì bộ giải mã của MapLibre chết, đúng lỗi mà
    # docs/data-pipeline.md:227 ghi lại.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      application/x-protobuf application/geo+json model/gltf-binary
                      image/svg+xml;

    # ---- Tile vector ------------------------------------------------------
    # `try_files $uri =404` là điều kiện sống còn nói ở đầu file.
    location ~ ^/tiles/ {
        root         /srv/public;
        # Khối `types` thay thế TOÀN BỘ bảng MIME kế thừa trong phạm vi của nó.
        # Đặt ở đây thì phạm vi chỉ là một thư mục chứa đúng một loại file, nên
        # an toàn; đặt ở `http` sẽ xoá sạch mime.types mặc định.
        types        { application/x-protobuf pbf; }
        default_type application/octet-stream;
        # MỘT header duy nhất. Chỉ thị `expires` cũng tự phát một dòng
        # Cache-Control, nên dùng kèm add_header là phản hồi mang hai dòng
        # Cache-Control cùng lúc — đo được: "max-age=3600" và "public".
        add_header   Cache-Control "public, max-age=3600";
        try_files    $uri =404;
    }

    # ---- Model, texture, sprite -------------------------------------------
    # Nhị phân, tên cố định. Liệt kê đủ các phần mở rộng thật sự có trong ba thư
    # mục này (đã đếm: glb, bin, png, jpg, json) vì `types` thay cả bảng.
    location ~ ^/(models|textures|sprites)/ {
        root       /srv/public;
        types {
            model/gltf-binary        glb;
            application/octet-stream bin;
            image/png                png;
            image/jpeg               jpg jpeg;
            application/json         json;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
        try_files  $uri =404;
    }

    # ---- style.json và feed API -------------------------------------------
    # style.json là NGUỒN, sửa tay được ngay trên volume; feed thì thay thường
    # xuyên. Cả hai không cache để sửa xong là thấy.
    location ~ ^/(styles|api)/ {
        root       /srv/public;
        types {
            application/geo+json geojson;
            application/json     json;
        }
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files  $uri =404;
    }

    # ---- Asset của Vite ----------------------------------------------------
    # Tên có hash nội dung ⇒ đổi nội dung là đổi tên, cache được vĩnh viễn.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    # ---- Vỏ app ------------------------------------------------------------
    # Trang này không có router, nên fallback gần như không bao giờ chạy. Giữ nó
    # cho những URL lạ, và nó an toàn vì bốn khối trên đã bắt hết đường dẫn dữ
    # liệu trước khi tới đây.
    location / {
        try_files  $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
