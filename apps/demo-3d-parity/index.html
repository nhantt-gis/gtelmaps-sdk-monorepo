<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>building-glass — đối chiếu với 3D plugin</title>
    <link rel="stylesheet" href="/gl/gtelmaps-gl.css" />
    <link rel="stylesheet" href="/src/style.css" />
    <!--
      Loaded as a script tag rather than imported: the fork's package.json still
      points `main` at upstream's `dist/maplibre-gl.js`, which this build does not
      produce. A tag also means the demo exercises the same artefact the render
      harness does, instead of a separately bundled copy of the source.
    -->
    <script src="/gl/gtelmaps-gl-dev.js"></script>
  </head>
  <body>
    <div id="panes">
      <section class="pane">
        <div id="map"></div>
      </section>
      <section class="pane" id="ref-pane" hidden>
        <header><span class="tag ref">3d-plugins</span> <span id="ref-url"></span></header>
        <iframe id="ref" referrerpolicy="no-referrer"></iframe>
      </section>
    </div>

    <div id="hud">
      <div class="modes">
        <label><input type="radio" name="mode" value="glass" checked /> <code>building-glass</code></label>
        <label><input type="radio" name="mode" value="atlas" /> <code>building-atlas</code></label>
      </div>
      <div id="glass-controls">
      <label><input type="checkbox" id="xray" checked /> X-quang <span class="hint">(xuyên nền và nhà khác)</span></label>
      <label><input type="checkbox" id="hidden-edges" checked /> Viền khuất <span class="hint">(mặt sau và mặt dưới)</span></label>
      <label><input type="checkbox" id="solid" /> Đối chiếu <code>fill-extrusion</code> đặc</label>
      <label><input type="checkbox" id="spin" /> Xoay camera <span class="hint">(fresnel chỉ lộ khi xoay)</span></label>
      <label>Viền <input type="range" id="edge" min="0" max="1" step="0.05" value="0.5" /></label>
      <label>Nền <input type="range" id="opacity" min="0" max="0.6" step="0.01" value="0.05" /></label>
      </div>
      <div id="atlas-controls" hidden>
        <label>Đêm <input type="range" id="night" min="0" max="1" step="0.05" value="0" /> <span class="hint">(cửa sổ sáng)</span></label>
        <label>Bề rộng ô <input type="range" id="bay" min="2" max="16" step="0.5" value="6" /></label>
      </div>
      <div id="readout"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
